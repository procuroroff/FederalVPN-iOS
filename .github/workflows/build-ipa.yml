name: Build iOS IPA (TrollStore / Sideload)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Облачный Mac M1/M2 от GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive (Fake-Signed / Ad-Hoc for TrollStore)
        run: |
          xcodebuild archive \
            -project FederalVPN.xcodeproj \
            -scheme FederalVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FederalVPN.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for TrollStore
        run: |
          mkdir -p build/Payload
          cp -r build/FederalVPN.xcarchive/Products/Applications/FederalVPN.app build/Payload/
          cd build
          zip -r FederalVPN.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FederalVPN-TrollStore
          path: build/FederalVPN.ipa
          retention-days: 14
