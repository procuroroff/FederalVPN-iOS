name: Build iOS IPA (TrollStore / Sideload)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install Build Tools (XcodeGen & ldid)
        run: |
          brew install xcodegen ldid

      - name: Download and Unpack Libbox.xcframework
        run: |
          mkdir -p Frameworks
          echo "Downloading Libbox.xcframework from sing-box build..."
          curl -sL "https://github.com/folexz/libbox-build/releases/download/v1.13.7/Libbox.xcframework.zip" -o Frameworks/Libbox.xcframework.zip
          unzip -q Frameworks/Libbox.xcframework.zip -d Frameworks/
          rm -f Frameworks/Libbox.xcframework.zip
          ls -la Frameworks/Libbox.xcframework

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project FederalVPN.xcodeproj \
            -scheme FederalVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FederalVPN.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package & Sign for TrollStore
        run: |
          mkdir -p build/Payload
          cp -r build/FederalVPN.xcarchive/Products/Applications/FederalVPN.app build/Payload/
          
          echo "Signing PacketTunnelExtension with entitlements for TrollStore..."
          if [ -d "build/Payload/FederalVPN.app/PlugIns/PacketTunnelExtension.appex" ]; then
            ldid -SPacketTunnelExtension/PacketTunnelExtension.entitlements build/Payload/FederalVPN.app/PlugIns/PacketTunnelExtension.appex/PacketTunnelExtension
          fi
          
          echo "Signing FederalVPNWidgets with entitlements for TrollStore..."
          if [ -d "build/Payload/FederalVPN.app/PlugIns/FederalVPNWidgets.appex" ]; then
            ldid -SWidgets/FederalVPNWidgets.entitlements build/Payload/FederalVPN.app/PlugIns/FederalVPNWidgets.appex/FederalVPNWidgets
          fi
          
          echo "Signing FederalVPN main application with entitlements for TrollStore..."
          ldid -SFederalVPN.entitlements build/Payload/FederalVPN.app/FederalVPN
          
          echo "Verifying embedded entitlements:"
          echo "=== FederalVPN.app entitlements ==="
          ldid -e build/Payload/FederalVPN.app/FederalVPN
          if [ -d "build/Payload/FederalVPN.app/PlugIns/PacketTunnelExtension.appex" ]; then
            echo "=== PacketTunnelExtension.appex entitlements ==="
            ldid -e build/Payload/FederalVPN.app/PlugIns/PacketTunnelExtension.appex/PacketTunnelExtension
          fi
          if [ -d "build/Payload/FederalVPN.app/PlugIns/FederalVPNWidgets.appex" ]; then
            echo "=== FederalVPNWidgets.appex entitlements ==="
            ldid -e build/Payload/FederalVPN.app/PlugIns/FederalVPNWidgets.appex/FederalVPNWidgets
          fi
          
          echo "Copying root-level icons for SpringBoard / TrollStore uicache..."
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@2x.png build/Payload/FederalVPN.app/AppIcon60x60@2x.png 2>/dev/null || true
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@3x.png build/Payload/FederalVPN.app/AppIcon60x60@3x.png 2>/dev/null || true
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@2x.png build/Payload/FederalVPN.app/Icon.png 2>/dev/null || true
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@2x.png build/Payload/FederalVPN.app/Icon@2x.png 2>/dev/null || true
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@3x.png build/Payload/FederalVPN.app/Icon@3x.png 2>/dev/null || true
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@2x.png build/Payload/FederalVPN.app/Icon-60@2x.png 2>/dev/null || true
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@3x.png build/Payload/FederalVPN.app/Icon-60@3x.png 2>/dev/null || true
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon76x76@2x~ipad.png build/Payload/FederalVPN.app/AppIcon76x76@2x~ipad.png 2>/dev/null || true
          
          cd build
          zip -r -9 FederalVPN.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FederalVPN-TrollStore
          path: build/FederalVPN.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 build/FederalVPN.ipa --clobber || gh release create v1.0.0 build/FederalVPN.ipa --title "Federal VPN iOS v1.0.0 (TrollStore)" --notes "Federal VPN iOS client with TrollStore entitlements"
