name: FederalVPN
options:
  bundleIdPrefix: com.federalvpn
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  developmentLanguage: ru

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  FederalVPN:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: Core
      - path: UI
      - path: Shared
    dependencies:
      - target: PacketTunnelExtension
      - target: FederalVPNWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federalvpn.app
        CODE_SIGN_ENTITLEMENTS: FederalVPN.entitlements
        INFOPLIST_FILE: App/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

  PacketTunnelExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PacketTunnelExtension
      - path: Shared
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: Network.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federalvpn.app.PacketTunnelExtension
        CODE_SIGN_ENTITLEMENTS: PacketTunnelExtension/PacketTunnelExtension.entitlements
        INFOPLIST_FILE: PacketTunnelExtension/Info.plist
        WRAPPER_EXTENSION: appex
        SKIP_INSTALL: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  FederalVPNWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Widgets
      - path: Shared/Models/VPNActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federalvpn.app.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/FederalVPNWidgets.entitlements
        INFOPLIST_FILE: Widgets/Info.plist
        WRAPPER_EXTENSION: appex
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
